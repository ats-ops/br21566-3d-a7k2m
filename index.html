<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ヒグマ頭骨3Dモデル</title>

<link rel="stylesheet" href="style.css">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

</head>

<body>

<header>

<h1>ヒグマ頭骨 3Dモデル</h1>

<p>
閲覧資料
</p>

</header>

<main>

<model-viewer

id="viewer"

src="bear.glb"

camera-controls

touch-action="pan-y"

auto-rotate

rotation-per-second="12deg"

shadow-intensity="1"

environment-image="neutral"

exposure="1"

interaction-prompt="auto"

ar

ar-modes="webxr scene-viewer quick-look"

loading="eager"

reveal="auto">

</model-viewer>

</main>

<footer>

<div class="guide">

<h2>操作方法</h2>

<ul>

<li>ドラッグ：回転</li>

<li>ホイール：拡大・縮小</li>

<li>Shift＋ドラッグ：移動</li>

<li>スマートフォンでは2本指で拡大縮小できます</li>

</ul>

</div>

<div class="info">

<h2>標本情報</h2>

<table>

<tr>
<th>標本名</th>
<td>ヒグマ頭骨</td>
</tr>

<tr>
<th>取得方法</th>
<td>3Dスキャン（Revo Scan）</td>
</tr>

<tr>
<th>形式</th>
<td>GLB</td>
</tr>

<tr>
<th>用途</th>
<td>閲覧資料</td>
</tr>

</table>

</div>

</footer>

<script src="script.js"></script>

</body>

</html>
